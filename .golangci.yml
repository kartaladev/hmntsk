version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        # sqlkit moves to its own repository before its first tag, so nothing
        # under it may import anything that stays behind. This is an early
        # warning only: depguard matches by prefix and cannot allow
        # github.com/kartaladev/hmntsk/sqlkit while refusing the root module
        # beside it, so `make split-check` is the authoritative check.
        sqlkit:
          list-mode: strict
          files:
            - "**/sqlkit/**"
          allow:
            - $gostd
            - github.com/kartaladev/hmntsk/sqlkit
            - github.com/stretchr/testify
            - github.com/testcontainers/testcontainers-go
            - github.com/jackc/pgx/v5
            - gorm.io
            - github.com/glebarez/sqlite
            - github.com/go-sql-driver/mysql
            - github.com/lib/pq
            - modernc.org/sqlite
        # notify moves to its own repository before its first tag too, and may
        # build on sqlkit, which moves out first. The same early-warning caveat
        # applies: `make split-check` is authoritative.
        notify:
          list-mode: strict
          files:
            - "**/notify/**"
          allow:
            - $gostd
            - github.com/kartaladev/hmntsk/notify
            - github.com/kartaladev/hmntsk/sqlkit
            - github.com/stretchr/testify
            - go.uber.org/goleak
            - go.uber.org/mock
            - github.com/jackc/pgx/v5
            - gorm.io
            - github.com/glebarez/sqlite
            - github.com/go-sql-driver/mysql
            - github.com/lib/pq
            - modernc.org/sqlite
            # The realtime adapters: each imports notify and its own client.
            - github.com/coder/websocket
            - github.com/redis/go-redis/v9
            - github.com/nats-io/nats.go
            - github.com/testcontainers/testcontainers-go
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: indent-error-flow
        - name: var-declaration
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: context-as-argument
        - name: unexported-return
    testifylint:
      disable:
        # The project's table-test style uses `assert` for independent checks so
        # that every failing row reports, and `require` only for preconditions
        # that must halt the case. require-error contradicts that deliberately.
        - require-error
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - revive
      - path: /mock_.*\.go$
        linters:
          - revive
          - gocritic

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kartaladev/hmntsk
