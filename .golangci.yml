version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - predeclared
    - revive
    - testifylint
    - unconvert
    - usetesting
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: indent-error-flow
        - name: var-declaration
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: context-as-argument
        - name: unexported-return
    testifylint:
      disable:
        # The project's table-test style uses `assert` for independent checks so
        # that every failing row reports, and `require` only for preconditions
        # that must halt the case. require-error contradicts that deliberately.
        - require-error
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - revive
      - path: /mock_.*\.go$
        linters:
          - revive
          - gocritic

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kartaladev/hmntsk
