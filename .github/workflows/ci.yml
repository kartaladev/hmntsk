name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Every job runs the Go version below. actions/setup-go sets GOTOOLCHAIN=local
  # once it is installed, so nothing here downloads a second toolchain; the
  # Makefile's own pin defers to that.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make lint
      # sqlkit moves to its own repository before its first tag. This fails if
      # anything under sqlkit/ imports a module that stays behind.
      - run: make split-check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Core, sqlcore, sqlkit and contract tests
        run: |
          set -e
          for module in . store/sqlcore sqlkit transport/core storetest transporttest relaytest; do
            echo "==> $module"
            (cd "$module" && go test -count=1 ./...)
          done

  # The storage conformance suite, once per valid driver-by-dialect combination.
  # Seven and not nine, because pgx is PostgreSQL-only. PostgreSQL and MySQL are
  # started by testcontainers against the runner's own Docker daemon; SQLite
  # runs in-process, which is what makes the suite cheap enough to run on every
  # commit.
  store-matrix:
    name: store ${{ matrix.module }} / ${{ matrix.dialect }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: store/sql, dialect: postgres, run: TestStoreOnPostgres }
          - { module: store/sql, dialect: mysql, run: TestStoreOnMySQL }
          - { module: store/sql, dialect: sqlite, run: TestStoreOnSQLite }
          - { module: store/pgx, dialect: postgres, run: TestStoreOnPostgres }
          - { module: store/gorm, dialect: postgres, run: TestStoreOnPostgres }
          - { module: store/gorm, dialect: mysql, run: TestStoreOnMySQL }
          - { module: store/gorm, dialect: sqlite, run: TestStoreOnSQLite }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Conformance suite
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 30m -run "^${{ matrix.run }}$" ./...

  # The sqlkit executor conformance suite, on the same seven driver-by-dialect
  # combinations: one Executor contract, proven identical on database/sql, pgx
  # and GORM.
  executor-matrix:
    name: executor ${{ matrix.module }} / ${{ matrix.dialect }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: sqlkit/stdsql, dialect: postgres, run: TestExecutorOnPostgres }
          - { module: sqlkit/stdsql, dialect: mysql, run: TestExecutorOnMySQL }
          - { module: sqlkit/stdsql, dialect: sqlite, run: TestExecutorOnSQLite }
          - { module: sqlkit/pgx, dialect: postgres, run: TestExecutorOnPostgres }
          - { module: sqlkit/gorm, dialect: postgres, run: TestExecutorOnPostgres }
          - { module: sqlkit/gorm, dialect: mysql, run: TestExecutorOnMySQL }
          - { module: sqlkit/gorm, dialect: sqlite, run: TestExecutorOnSQLite }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Executor conformance suite
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 30m -run "^${{ matrix.run }}$" ./...

  # Claiming, retry scheduling and dead-lettering are storage behaviour, so the
  # relay suite runs on every combination the store suite does. A lease that
  # works on PostgreSQL and not on SQLite is exactly the bug this catches.
  relay-matrix:
    name: relay ${{ matrix.module }} / ${{ matrix.dialect }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: store/sql, dialect: postgres, run: TestRelayOnPostgres }
          - { module: store/sql, dialect: mysql, run: TestRelayOnMySQL }
          - { module: store/sql, dialect: sqlite, run: TestRelayOnSQLite }
          - { module: store/pgx, dialect: postgres, run: TestRelayOnPostgres }
          - { module: store/gorm, dialect: postgres, run: TestRelayOnPostgres }
          - { module: store/gorm, dialect: mysql, run: TestRelayOnMySQL }
          - { module: store/gorm, dialect: sqlite, run: TestRelayOnSQLite }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Relay conformance suite
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 30m -run "^${{ matrix.run }}$" ./...

  # The sinks. The webhook sink needs only an HTTP test server; the Redis and
  # NATS sinks start a broker through testcontainers, against the runner's own
  # Docker daemon, in the same way the store suite starts its databases.
  delivery:
    name: delivery ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [delivery/webhook, delivery/redis, delivery/nats]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Sink tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 30m ./...

  # The same contract, once per framework binding.
  transport-matrix:
    name: transport ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [transport/http, transport/gin, transport/fiber]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Conformance suite
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 15m ./...

  # The race detector matters most where this project is least conventional:
  # the escalation sweep, the after-commit dispatch and the adapters' shared
  # connections are all genuinely concurrent.
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - run: make test-race

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln

  # The OpenAPI document is generated from the route table and committed. This
  # fails if the two have drifted, which is the whole reason it is committed.
  generated:
    name: generated artefacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      # go generate runs mockgen, which is not on a bare runner. Pin it to the
      # go.uber.org/mock version the modules depend on, so the mocks this job
      # regenerates are the ones the build compiles against.
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0
      - name: Regenerate and diff
        run: |
          set -e
          (cd transport/core && go test -count=1 -run TestOpenAPIDocument -update ./...)
          go generate ./...
          git diff --exit-code
